server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Astro builds directory-format pages (/site/index.html); resolve clean URLs,
  # trailing slashes, and .html fallbacks, otherwise 404.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # long-cache the hashed build assets
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
