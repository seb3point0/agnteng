server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # This host serves one page. The build is the whole design-system site, so the
  # deck is at /sponsorship/ inside it; here it is served AT the root rather
  # than redirected to, so the address bar keeps saying sponsors.agnteng.com.
  location = / {
    try_files /sponsorship/index.html =404;
  }

  # Hashed build output: bundles, CSS, and the imported talk stills.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Everything the deck loads from public/: event photos, QR codes, the logo.
  location /assets/ {
    try_files $uri =404;
  }

  location = /favicon.svg {
    try_files $uri =404;
  }

  # The rest of the design-system site is built into this image but does not
  # belong on a sponsor-facing domain. A sponsor who trims the URL should not
  # land in the brand guidelines.
  location / {
    return 404;
  }
}
